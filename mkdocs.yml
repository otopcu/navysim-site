site_name: NavySim Documentation
site_url: https://otopcu.github.io/navysim-site/
site_description: NavySim (Navy Simulation, formerly NSTMSS) is an HLA-based distributed naval simulation suite with ship-handling simulators, exercise management and federation monitoring on IEEE 1516-2025 (HLA 4).
site_author: Okan Topçu
copyright: Copyright &copy; 2005–2026 oToT

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Components: Components.md
  - Federates:
      - MekoFd:
          - User Manual: Maritime/MekoFd/UserManual.md
          - Release Notes: Maritime/MekoFd/ReleaseNotes.md
      - KnoxFd:
          - User Manual: Maritime/KnoxFd/UserManual.md
          - Release Notes: Maritime/KnoxFd/Release Notes.md
      - ExMFd:
          - User Manual: ExMFd/UserManual.md
          - Release Notes: ExMFd/ReleaseNotes.md
      - EnviFd:
          - User Manual: EnviFd/UserManual.md
          - Release Notes: EnviFd/ReleaseNotes.md
      - FedMonFd:
          - User Manual: FedMonFd/UserManual.md
          - Release Notes: FedMonFd/ReleaseNotes.md
      - TacPicFd:
          - User Manual: TacPicFd/UserManual.md
          - Release Notes: TacPicFd/ReleaseNotes.md
  - Tools:
      - Sen:
          - User Manual: Sen/UserManual.md
          - Release Notes: Sen/ReleaseNotes.md
  - Federation Object Model:
      - FOM: FOM/Fom.md
      - Scenario Execution: FOM/ScenarioExecution.md
      - Typed Event Injection: FOM/TypedEventInjection.md
      - FDD Release Notes: FOM/FDD/ReleaseNotes.md
      - RID Release Notes: FOM/RID/ReleaseNotes.md
  - Libraries:
      - NFL Release Notes: NFL/ReleaseNotes.md
  - What's New: WhatsNew.md
  - Release Notes: ReleaseNotes.md
  - Disclaimer: Disclaimer.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

hooks:
  - hooks/links.py

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: info
    unrecognized_links: info

extra:
  # Search engine metadata, written into every page by overrides/main.html.
  keywords: NavySim, NSTMSS, naval simulation, navy simulation, distributed simulation, High Level Architecture, HLA, HLA 4, IEEE 1516, IEEE 1516-2025, Fora, RTI, federation, federate, ship-handling simulator, ship simulator, frigate simulator, MEKO frigate, Knox frigate, maneuvering simulation, C2SIM, naval training, Okan Topcu
  og_image: https://otopcu.github.io/navysim-site/Maritime/MekoFd/images/current/overview.png
  # Google Search Console: paste the content value of the verification meta tag here.
  google_site_verification: ''
